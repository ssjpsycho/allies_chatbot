[project]
name = "allies-discord-bot"
version = "0.1.0"
description = "Discord assistant grounded in the Allies of Majesty wiki and EPUB sources."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.5,<3.0",
    "ebooklib>=0.19,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=1.0,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "qdrant-client>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"